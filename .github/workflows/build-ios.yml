name: Build iOS App (IPA)

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor iOS Project
        run: |
          mkdir -p out
          touch out/index.html
          npx cap sync ios

      - name: Build iOS Application (Xcode)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            TARGET_FLAG="-workspace App.xcworkspace"
          else
            TARGET_FLAG="-project App.xcodeproj"
          fi
          xcodebuild clean build \
            $TARGET_FLAG \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package App into IPA
        run: |
          APP_PATH=$(find ios/App/derived_data -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found!"
            exit 1
          fi
          echo "Found App.app at: $APP_PATH"
          mkdir -p build_output/Payload
          cp -r "$APP_PATH" build_output/Payload/
          cd build_output
          zip -r ../AuraMusic.ipa Payload
          cd ..
          echo "Created AuraMusic.ipa successfully!"
          ls -lh AuraMusic.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-iOS-App
          path: AuraMusic.ipa
          retention-days: 14
