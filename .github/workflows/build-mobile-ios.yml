name: Build Aura Mobile iOS (unsigned IPA)

# Unsigned on purpose: Sideloadly signs the IPA with a free Apple ID at install time.
on:
  push:
    branches: [ mobile-ios ]
    paths:
      - 'aura-music-mobile/**'
      - '.github/workflows/build-mobile-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    # Expo SDK 58 requires Xcode 26.4+
    runs-on: macos-26
    defaults:
      run:
        working-directory: aura-music-mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: aura-music-mobile/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate iOS Project
        run: npx expo prebuild --platform ios --no-install

      - name: Install Pods
        run: pod install
        working-directory: aura-music-mobile/ios

      - name: Build Release App
        working-directory: aura-music-mobile/ios
        run: |
          xcodebuild -version
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "${WORKSPACE%.xcworkspace}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: aura-music-mobile/ios
        run: |
          APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr AuraMusic.ipa Payload
          ls -lh AuraMusic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Mobile-iOS
          path: aura-music-mobile/ios/AuraMusic.ipa
          retention-days: 14
