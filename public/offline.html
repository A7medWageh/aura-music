<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - MusicWeb</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #090a0f;
        color: #f5f7ff;
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        background: #11131a;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 20px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: rgba(245, 247, 255, 0.75);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>You are offline</h1>
      <p>
        MusicWeb will keep playing cached audio and sync your offline activity once the network
        returns.
      </p>
    </section>
  </body>
</html>
